name: bazaar_sort
description: "Bazaar Sort - a cozy hybrid-casual sort puzzle set in a historic bazaar."
publish_to: 'none'

# Version: <marketing version>+<build number>. See RELEASE.md for the bump policy.
version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flame: ^1.38.2
  flame_audio: ^2.12.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  hive_ce: ^2.23.3
  hive_ce_flutter: ^2.5.0
  intl: ^0.20.2
  material_ui: ^1.1.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
