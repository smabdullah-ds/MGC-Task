name: bazaar_sort
description: "Bazaar Sort - a cozy hybrid-casual sort puzzle set in a historic bazaar."
publish_to: 'none'

# Version: <marketing version>+<build number>. See RELEASE.md for the bump policy.
version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  app_tracking_transparency: ^2.0.7
  firebase_analytics: ^13.1.0
  firebase_core: ^5.2.0
  firebase_crashlytics: ^6.1.0
  firebase_messaging: ^17.1.0
  firebase_remote_config: ^7.1.0
  flame: ^1.38.2
  flame_audio: ^2.12.2
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_timezone: ^5.1.1
  gma_mediation_applovin: ^2.7.0
  gma_mediation_meta: ^1.7.2
  gma_mediation_mintegral: ^2.1.6
  gma_mediation_unity: ^1.12.0
  go_router: ^18.1.4
  google_mobile_ads: ^9.2.0
  hive_ce: ^2.23.3
  hive_ce_flutter: ^2.5.0
  intl: ^0.20.2
  material_ui: ^1.1.0
  meta: ^1.16.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  purchases_flutter: ^11.0.3
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/levels/
    - assets/audio/

# App icons: `dart run flutter_launcher_icons` (source art in assets/branding).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#2B1B10"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  min_sdk_android: 24

# Native splash: `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#2B1B10"
  image: assets/branding/splash.png
  android_12:
    color: "#2B1B10"
    image: assets/branding/icon_foreground.png
  fullscreen: true
